[package]
name = "linux-bzimage-setup"
version = "0.16.0"
edition = "2021"
description = "The linux bzImage setup binary"
license = "MPL-2.0"
repository = "https://github.com/asterinas/asterinas"

[[bin]]
name = "linux-bzimage-setup"
path = "src/main.rs"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
vstd = { workspace = true }
cfg-if = "1.0.0"
# core2 = { version = "0.4.0", default-features = false, features = ["nightly"] }
# core2 0.4.0 is yanked, and libflate 2.3 uses no_std_io2 for no_std I/O.
no_std_io2 = { version = "0.9.4", default-features = false, features = ["alloc"] }
libflate = { version = "2.1.0", default-features = false }
linux-boot-params = { version = "0.16.0", path = "../boot-params" }
uart_16550 = "0.3.0"
xmas-elf = "0.10.0"

[target.x86_64-unknown-none.dependencies]
log = "0.4.20"
uefi = { version = "0.32.0", features = ["global_allocator", "panic_handler", "logger", "qemu"]}
uefi-raw = "0.8.0"
vstd_extra = { path = "../../../../verified_libs/vstd_extra", features = ["uefi-raw"] }
# tdx-guest = { version = "0.2.1", optional = true }
# tdx-guest 0.2.1 uses x86_64 0.14, whose Step impls do not compile on Rust 1.100.
tdx-guest = { version = "0.4.0", optional = true }

[features]
default = ["cvm_guest"]
debug_print = []
cvm_guest = ["dep:tdx-guest"]

[package.metadata.verus]
verify = true

[lints]
workspace = true
