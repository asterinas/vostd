[package]
name = "linux-bzimage-setup"
description = "The linux bzImage setup binary"
version.workspace = true
repository.workspace = true
license.workspace = true
edition.workspace = true

[[bin]]
name = "linux-bzimage-setup"
path = "src/main.rs"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
linux-boot-params.workspace = true
log.workspace = true
miniz_oxide.workspace = true
uart_16550.workspace = true
xmas-elf.workspace = true
cfg-if = "1.0.0"
core2 = { version = "0.4.0", default-features = false, features = ["nightly"] }
libflate = { version = "2.1.0", default-features = false }

[target.x86_64-unknown-none.dependencies]
tdx-guest = { workspace = true, optional = true }
uefi-raw.workspace = true
uefi.workspace = true

[features]
default = ["cvm_guest"]
debug_print = []
cvm_guest = ["dep:tdx-guest"]

[lints]
workspace = true
