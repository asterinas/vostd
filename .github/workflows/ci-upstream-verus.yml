name: Verify VOSTD (Main) with verus-lang/verus

on:
  push:
    branches:
      - main
  issue_comment:
    types: [created]
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read
  statuses: write

jobs:
  verify-upstream-verus:
    if: >
      github.event_name != 'issue_comment' ||
      (github.event.issue.pull_request &&
       contains(github.event.comment.body, '/ci-upstream-verus') &&
       contains(fromJSON('["OWNER", "MEMBER", "COLLABORATOR"]'), github.event.comment.author_association))
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-24.04
          - macos-14
    env:
      CARGO_TERM_COLOR: always

    steps:
      - name: Get PR head commit
        id: pr
        if: github.event_name == 'issue_comment'
        uses: actions/github-script@v9
        with:
          script: |
            const { owner, repo } = context.repo;
            const pull_number = context.payload.issue.number;
            const { data: pull } = await github.rest.pulls.get({ owner, repo, pull_number });

            core.setOutput('head_sha', pull.head.sha);

      - name: Mark upstream Verus verification as pending
        if: github.event_name == 'issue_comment'
        continue-on-error: true
        uses: actions/github-script@v9
        with:
          retries: 3
          script: |
            const { owner, repo } = context.repo;
            const runUrl = `${context.serverUrl}/${owner}/${repo}/actions/runs/${context.runId}`;

            await github.rest.repos.createCommitStatus({
              owner,
              repo,
              sha: '${{ steps.pr.outputs.head_sha }}',
              state: 'pending',
              context: 'ci/upstream-verus (${{ matrix.os }})',
              description: 'Upstream Verus verification is running',
              target_url: runUrl,
            });

      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event_name == 'issue_comment' && format('refs/pull/{0}/merge', github.event.issue.number) || github.ref }}
          submodules: recursive

      - name: Install dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt update -qq
          sudo apt install -y build-essential unzip pkg-config libssl-dev llvm

      - name: Run dv bootstrap with upstream verus
        # macOS stays informational until the `--upstream-verus` from-source
        # build is validated there (z3/llvm deps may be missing on the runner).
        continue-on-error: ${{ matrix.os == 'macos-14' }}
        run: cargo dv bootstrap --upstream-verus

      - name: Merge pending upstream verus PRs and rebuild verus
        working-directory: tools/verus
        continue-on-error: ${{ matrix.os == 'macos-14' }}
        run: |
          git remote add upstream https://github.com/verus-lang/verus.git || true
          git fetch upstream pull/2921/head:pr-2921
          git config user.name "VOSTD CI Bot"
          git config user.email "ci@asterinas.vostd"
          git merge pr-2921 --no-edit
          cd "$GITHUB_WORKSPACE"
          cargo dv bootstrap --upstream-verus

      - name: Verify ostd with upstream verus
        id: verify
        continue-on-error: ${{ matrix.os == 'macos-14' }}
        run: make

      - name: Report upstream Verus verification status
        if: always() && github.event_name == 'issue_comment'
        continue-on-error: true
        uses: actions/github-script@v9
        with:
          retries: 3
          script: |
            const { owner, repo } = context.repo;
            const runUrl = `${context.serverUrl}/${owner}/${repo}/actions/runs/${context.runId}`;
            const ok = '${{ steps.verify.outcome }}' === 'success';
            const state = ok ? 'success' : 'failure';
            const description = ok
              ? 'Upstream Verus verification passed'
              : 'Upstream Verus verification failed';

            await github.rest.repos.createCommitStatus({
              owner,
              repo,
              sha: '${{ steps.pr.outputs.head_sha }}',
              state,
              context: 'ci/upstream-verus (${{ matrix.os }})',
              description,
              target_url: runUrl,
            });
