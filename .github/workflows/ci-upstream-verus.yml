name: Verify VOSTD with rebased Verus IRC11

on:
  push:
    branches:
      - main
  issue_comment:
    types: [created]
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read
  statuses: write

jobs:
  verify-upstream-verus:
    if: >
      github.event_name != 'issue_comment' ||
      (github.event.issue.pull_request &&
       contains(github.event.comment.body, '/ci-upstream-verus') &&
       contains(fromJSON('["OWNER", "MEMBER", "COLLABORATOR"]'), github.event.comment.author_association))
    runs-on: ubuntu-24.04
    env:
      CARGO_TERM_COLOR: always
      VERUS_REPOSITORY: https://github.com/asterinas/verus.git
      VERUS_BASE_COMMIT: bb61343fc97e4b3a97b1029f385ffb6bbb291da2
      VERUS_IRC11_PATCH: tools/patches/verus-irc11.patch
      VERUS_PATCH: tools/patches/verus-irc11-vstd.patch

    steps:
      - name: Get PR head commit
        id: pr
        if: github.event_name == 'issue_comment'
        uses: actions/github-script@v9
        with:
          script: |
            const { owner, repo } = context.repo;
            const pull_number = context.payload.issue.number;
            const { data: pull } = await github.rest.pulls.get({ owner, repo, pull_number });

            core.setOutput('head_sha', pull.head.sha);

      - name: Mark upstream Verus verification as pending
        if: github.event_name == 'issue_comment'
        continue-on-error: true
        uses: actions/github-script@v9
        with:
          retries: 3
          script: |
            const { owner, repo } = context.repo;
            const runUrl = `${context.serverUrl}/${owner}/${repo}/actions/runs/${context.runId}`;

            await github.rest.repos.createCommitStatus({
              owner,
              repo,
              sha: '${{ steps.pr.outputs.head_sha }}',
              state: 'pending',
              context: 'ci/upstream-verus',
              description: 'Upstream Verus IRC11 verification is running',
              target_url: runUrl,
            });

      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event_name == 'issue_comment' && format('refs/pull/{0}/merge', github.event.issue.number) || github.ref }}
          submodules: recursive

      - name: Install dependencies
        run: |
          sudo apt update -qq
          sudo apt install -y build-essential unzip pkg-config libssl-dev llvm

      - name: Bootstrap rebased Verus IRC11
        run: |
          rm -rf tools/verus
          git clone --no-checkout "$VERUS_REPOSITORY" tools/verus
          git -C tools/verus checkout --detach "$VERUS_BASE_COMMIT"
          git -C tools/verus apply "$GITHUB_WORKSPACE/$VERUS_IRC11_PATCH"
          cargo dv bootstrap
          test "$(git -C tools/verus rev-parse HEAD)" = "$VERUS_BASE_COMMIT"
          git -C tools/verus apply --reverse --check "$GITHUB_WORKSPACE/$VERUS_IRC11_PATCH"

      - name: Enable IRC11 alongside existing SC atomics
        run: |
          if git -C tools/verus apply --reverse --check "$GITHUB_WORKSPACE/$VERUS_PATCH"; then
            echo "IRC11 compatibility patch is already applied"
          else
            git -C tools/verus apply "$GITHUB_WORKSPACE/$VERUS_PATCH"
          fi

      - name: Verify ostd with upstream Verus IRC11
        run: make

      - name: Report upstream Verus verification status
        if: always() && github.event_name == 'issue_comment'
        continue-on-error: true
        uses: actions/github-script@v9
        with:
          retries: 3
          script: |
            const { owner, repo } = context.repo;
            const runUrl = `${context.serverUrl}/${owner}/${repo}/actions/runs/${context.runId}`;
            const state = '${{ job.status }}' === 'success' ? 'success' : 'failure';
            const description = state === 'success'
              ? 'Upstream Verus IRC11 verification passed'
              : 'Upstream Verus IRC11 verification failed';

            await github.rest.repos.createCommitStatus({
              owner,
              repo,
              sha: '${{ steps.pr.outputs.head_sha }}',
              state,
              context: 'ci/upstream-verus',
              description,
              target_url: runUrl,
            });
