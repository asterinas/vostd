name: Deploy Rust docs to GitHub Pages

# Deploys rustdoc to GitHub Pages. To keep the verify-perf benchmark chart
# fresh, this runs AFTER `verify-perf` completes (workflow_run), so the
# benchmark's `dev/bench/` is already on the gh-pages branch when we embed it
# into the artifact — no stale-chart race. PRs build only; manual deploys via
# workflow_dispatch.

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:
  workflow_run:
    workflows: ["verify-perf"]
    types: [completed]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: ${{ github.workflow }}-${{ github.event.workflow_run.head_sha || github.ref }}
  cancel-in-progress: true

jobs:
  build:
    # Only build on PR/dispatch, or on a workflow_run triggered by a *push* to
    # main verify-perf (skip PR-comment `/verify-perf` runs).
    if: github.event_name != 'workflow_run' || github.event.workflow_run.event == 'push'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          # workflow_run runs on the default branch's workflow file; build the
          # exact commit verify-perf ran on.
          ref: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.ref }}
          submodules: recursive

      - name: Install dependencies
        run: |
          sudo apt update -qq
          sudo apt install -y build-essential unzip pkg-config libssl-dev llvm

      - name: Get Rust toolchain version
        id: rust-toolchain
        run: |
          RUST_VERSION=$(grep 'channel' rust-toolchain.toml | sed -E 's/.*= *"(.*)"/\1/')
          if [ -z "$RUST_VERSION" ]; then
            echo "Failed to extract Rust version from rust-toolchain.toml"
            exit 1
          fi
          echo "RUST_VERSION=$RUST_VERSION" >> "$GITHUB_ENV"
          echo "Rust version: $RUST_VERSION"

      - name: Cache Rust toolchain
        uses: actions/cache@v6
        with:
          path: |
            ~/.rustup/toolchains
            ~/.rustup/update-hashes
            ~/.rustup/tmp
          key: ${{ runner.os }}-rust-toolchain-${{ env.RUST_VERSION }}

      - name: Cache Cargo dependencies
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Get Verus commit
        id: verus
        run: |
          VERUS_COMMIT=$(git ls-remote https://github.com/asterinas/verus HEAD | cut -f1)
          echo "VERUS_COMMIT=$VERUS_COMMIT" >> "$GITHUB_ENV"
          echo "Using Verus commit: $VERUS_COMMIT"
          DV_COMMIT=$(git rev-parse HEAD:dv)
          echo "DV_COMMIT=$DV_COMMIT" >> "$GITHUB_ENV"
          echo "Using dv commit: $DV_COMMIT"

      - name: Cache dv build artifacts
        uses: actions/cache@v6
        with:
          path: dv/target
          key: ${{ runner.os }}-dv-${{ env.DV_COMMIT }}

      - name: Cache Verus
        id: cache-verus
        uses: actions/cache@v6
        with:
          path: tools/verus
          key: ${{ runner.os }}-verus-${{ env.VERUS_COMMIT }}

      - name: Cache verusfmt
        id: cache-verusfmt
        uses: actions/cache@v6
        with:
          path: ~/.cargo/bin/verusfmt
          key: ${{ runner.os }}-verusfmt-${{ env.VERUS_COMMIT }}

      - name: Bootstrap Verus (if needed)
        run: |
          if [ "${{ steps.cache-verus.outputs.cache-hit }}" = "true" ]; then
            echo "Using cached Verus"
          else
            echo "Cache miss, bootstrapping Verus..."
            rm -rf tools/verus
            cargo dv bootstrap
          fi

          if ! command -v verusfmt >/dev/null 2>&1; then
            echo "verusfmt not found, installing via cargo dv bootstrap..."
            cargo dv bootstrap
          fi
          verusfmt --version

      - name: Build docs
        run: make doc

      # Pull this run's `dev/bench/` (just pushed by verify-perf on the
      # gh-pages branch) into the rustdoc artifact so the benchmark chart is
      # served at <site>/dev/bench/.
      - name: Embed verify-perf benchmark into the doc artifact
        run: |
          set -e
          if ! git fetch --depth=1 origin gh-pages 2>/dev/null; then
            echo "no gh-pages branch yet; benchmark not embedded"
            exit 0
          fi
          git checkout FETCH_HEAD -- dev/bench || { echo "no dev/bench on gh-pages; skipping"; exit 0; }
          mkdir -p doc/dev
          mv dev/bench doc/dev/bench
          rmdir dev 2>/dev/null || true
          echo "embedded dev/bench into the doc artifact:"
          ls doc/dev/bench

      - name: Upload artifact
        # Deploy on dispatch, and on a workflow_run only if verify-perf
        # *succeeded* (don't publish docs/benchmark from a failed perf run).
        if: >
          github.event_name != 'pull_request' &&
          (github.event_name != 'workflow_run' ||
           github.event.workflow_run.conclusion == 'success')
        uses: actions/upload-pages-artifact@v5
        with:
          path: doc

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    needs: build
    if: >
      github.event_name != 'pull_request' &&
      (github.event_name != 'workflow_run' ||
       github.event.workflow_run.conclusion == 'success')
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
