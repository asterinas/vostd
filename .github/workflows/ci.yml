name: Verify VOSTD

# Pipeline: verify legs (per os/target, --time-expanded) upload logs; perf parses
# the x86_64 leg's log; doc builds the docs; perf-history pushes the verify-perf
# chart; stats takes the verification snapshot; publish (pushes only) records
# the history point on gh-pages and deploys the site (dashboard at the root,
# /stats/, /verusdoc/, /dev/bench/).

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

defaults:
  run:
    shell: bash

jobs:
  verify:
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          # RISC-V/LoongArch on Linux only; the triple selects the arch module
          # in `ostd/src/lib.rs`.
          - os: ubuntu-latest
            rust_target: x86_64-unknown-none
          - os: ubuntu-latest
            rust_target: riscv64imac-unknown-none-elf
          - os: ubuntu-latest
            rust_target: loongarch64-unknown-none-softfloat
          - os: macos-latest
            rust_target: x86_64-unknown-none
    timeout-minutes: 240
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          # push: the pushed commit; pull_request: the merge commit.
          ref: ${{ github.sha }}
          submodules: recursive

      - name: Verify OSTD and publish log
        uses: ./.github/actions/verify
        with:
          rust-target: ${{ matrix.rust_target }}
          runner-label: ${{ matrix.os }}

  format:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 45
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Set up toolchain and caches
        uses: ./.github/actions/setup-verus
        with:
          install-verusfmt: 'true'

      - name: Run format
        run: make fmt

      - name: Check for formatting changes
        run: |
          if [[ -n $(git status --porcelain) ]]; then
            echo "Code is not properly formatted. Run 'make fmt'."
            git diff
            echo "FMT_FAILED=1" >> "$GITHUB_ENV"
            exit 1
          fi

      - name: Publish summary
        if: always()
        run: |
          {
            echo "# Format Summary"
            if [[ "${FMT_FAILED:-0}" == "1" ]]; then
              echo "- Formatting: ❌ failed"
            else
              echo "- Formatting: ✅ passed"
            fi
          } >> "$GITHUB_STEP_SUMMARY"

  stats:
    # Takes the per-module verification snapshot against the phaseII/mainline
    # baseline and uploads it for `publish`; skips the verified-API count when
    # doc's rustdoc JSON artifact is missing.
    needs: [doc]
    if: >
      always() &&
      !cancelled()
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 60
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Take verification statistics snapshot
        uses: ./.github/actions/stats

      - name: Publish summary
        if: always()
        run: |
          {
            echo "# Stats Summary"
            echo "- Verification snapshot: ${{ job.status == 'success' && '✅ taken and uploaded' || '❌ failed' }}"
          } >> "$GITHUB_STEP_SUMMARY"

  perf:
    # Parses the verify log and reports the verification cost vs. last main.
    needs: [verify]
    if: >
      always() &&
      !cancelled() &&
      needs.verify.result != 'cancelled'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      baseline-cache-hit: ${{ steps.perf.outputs.baseline-cache-hit }}
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}

      - name: Analyze verification performance
        id: perf
        uses: ./.github/actions/perf
        with:
          verification-result: ${{ needs.verify.result }}

  perf-history:
    # Main only: pushes the verify-perf chart to gh-pages and saves the
    # next baseline.
    needs: [verify, perf]
    if: >
      github.event_name != 'pull_request' &&
      github.ref == 'refs/heads/main' &&
      needs.verify.result == 'success' &&
      needs.perf.result == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}

      - name: Publish performance history
        uses: ./.github/actions/perf-history
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          baseline-cache-hit: ${{ needs.perf.outputs.baseline-cache-hit }}

  doc:
    # Builds the docs; stats counts verified APIs from the uploaded rustdoc JSON.
    if: >
      always() &&
      !cancelled()
    runs-on: ubuntu-latest
    permissions:
      contents: read
      statuses: write   # ci/doc pending status on push
    timeout-minutes: 90
    steps:
      - name: Mark doc CI as pending
        if: github.event_name == 'push'
        continue-on-error: true
        uses: actions/github-script@v9
        env:
          STATUS_SHA: ${{ github.sha }}
        with:
          retries: 3
          script: |
            const { owner, repo } = context.repo;
            const runUrl = `${context.serverUrl}/${owner}/${repo}/actions/runs/${context.runId}`;

            await github.rest.repos.createCommitStatus({
              owner,
              repo,
              sha: process.env.STATUS_SHA,
              state: 'pending',
              context: 'ci/doc',
              description: 'Docs build is running',
              target_url: runUrl,
            });

      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Build documentation and publish artifacts
        uses: ./.github/actions/build-docs

      - name: Publish summary
        if: always()
        run: |
          {
            echo "# Doc Summary"
            echo "- Docs build: ${{ job.status == 'success' && '✅ passed' || '❌ failed' }}"
          } >> "$GITHUB_STEP_SUMMARY"

  publish:
    # Records the stats history point on gh-pages and deploys the site —
    # dashboard at the root, /verusdoc/, /dev/bench/, /stats/.
    # Requires doc explicitly: stats succeeds even without doc's rustdoc JSON
    # (it just skips the API count), so stats alone would deploy a hole.
    needs: [doc, perf, perf-history, verify, stats]
    if: >
      always() &&
      !cancelled() &&
      github.event_name != 'pull_request' &&
      github.ref == 'refs/heads/main' &&
      needs.verify.result == 'success' &&
      needs.doc.result == 'success' &&
      needs.stats.result == 'success' &&
      (needs.perf.result == 'success' || needs.perf.result == 'skipped') &&
      (needs.perf-history.result == 'success' || needs.perf-history.result == 'skipped')
    runs-on: ubuntu-latest
    permissions:
      contents: write   # push the stats history point to gh-pages
      pages: write      # deploy to GitHub Pages
      id-token: write   # deploy to GitHub Pages
    timeout-minutes: 60
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Publish history and deploy Pages
        uses: ./.github/actions/pages

      - name: Publish summary
        if: always()
        run: |
          {
            echo "# Publish Summary"
            echo "- Verification dashboard: ${{ job.status == 'success' && '✅ recorded and deployed' || '❌ failed' }}"
          } >> "$GITHUB_STEP_SUMMARY"

  report:
    needs: [doc, publish]
    if: always() && github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      statuses: write
    timeout-minutes: 10
    steps:
      - name: Report doc status on the commit
        continue-on-error: true
        uses: actions/github-script@v9
        env:
          STATUS_SHA: ${{ github.sha }}
        with:
          retries: 3
          script: |
            const { owner, repo } = context.repo;
            const runUrl = `${context.serverUrl}/${owner}/${repo}/actions/runs/${context.runId}`;

            const buildResult = '${{ needs.doc.result }}';
            const deployResult = '${{ needs.publish.result }}';
            // deploy is skipped when docs aren't published -- not a failure.
            const ok = buildResult === 'success' &&
              (deployResult === 'success' || deployResult === 'skipped');

            await github.rest.repos.createCommitStatus({
              owner,
              repo,
              sha: process.env.STATUS_SHA,
              state: ok ? 'success' : 'failure',
              context: 'ci/doc',
              description: ok ? 'Docs CI succeeded' : 'Docs CI failed',
              target_url: runUrl,
            });
