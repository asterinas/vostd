name: Format and Verify VOSTD (Main)

# One verification run feeds everything: a verify leg runs with
# --time-expanded and uploads the log, `perf` parses it (never re-verifies),
# `doc` builds the docs in parallel, and `doc-deploy` merges those docs with
# the gh-pages benchmark before deploying. `format` needs no Verus.

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

defaults:
  run:
    shell: bash

jobs:
  format-and-verify:
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-24.04
          - macos-14
    timeout-minutes: 240
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          # push: the pushed commit; pull_request: the merge commit.
          ref: ${{ github.sha }}
          submodules: recursive

      - name: Set up toolchain and caches
        uses: ./.github/actions/setup-verus
        with:
          verus: 'true'
          install-verusfmt: 'false'

      # `make` plus --time-expanded for the perf job's log.
      - name: Run verification
        run: |
          set -o pipefail
          if ! cargo dv verify --targets ostd -- --time-expanded 2>&1 | tee verify_output.txt; then
            echo "❌ Verification failed"
            echo "VERIFY_FAILED=1" >> "$GITHUB_ENV"
            exit 1
          else
            echo "✅ Verification passed!"
          fi

      - name: Check for verification warnings
        if: always() && runner.os == 'Linux'
        run: |
          WARNINGS=(
            "note: automatically chose triggers for this expression:|auto-trigger notes"
            "warning: use of deprecated method \`vstd::set::Set::<A>::finite\`|deprecated Set::finite()"
            "warning: use of deprecated associated function \`vstd::set::Set::<A>::new_assuming_finite\`|deprecated Set::new_assuming_finite()"
          )

          FAILED=0
          for ITEM in "${WARNINGS[@]}"; do
            PATTERN="${ITEM%%|*}"
            LABEL="${ITEM##*|}"
            if grep -q "$PATTERN" verify_output.txt 2>/dev/null; then
              echo "❌ Found $LABEL"
              grep -n "$PATTERN" verify_output.txt
              FAILED=1
            else
              echo "✅ No $LABEL found"
            fi
          done

          if [[ "$FAILED" == "1" ]]; then
            echo "VERIFY_WARNINGS_FOUND=1" >> "$GITHUB_ENV"
            exit 1
          fi

      - name: Upload verification log
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: verify-log-${{ matrix.os }}
          path: verify_output.txt
          retention-days: 7
          if-no-files-found: warn

      - name: Publish summary
        if: always()
        run: |
          {
            echo "# CI Summary (${{ matrix.os }})"
            if [[ "${VERIFY_FAILED:-0}" == "1" ]]; then
              echo "- Verification: ❌ failed"
            else
              echo "- Verification: ✅ passed"
            fi
            if [[ "${VERIFY_WARNINGS_FOUND:-0}" == "1" ]]; then
              echo "- Verification warnings: ❌ found"
            else
              echo "- Verification warnings: ✅ none"
            fi
          } >> "$GITHUB_STEP_SUMMARY"

  format:
    # Needs no Verus build: only rustfmt/verusfmt and the Verus sources for
    # the vstd path dependency (fetched below).
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    timeout-minutes: 45
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Set up toolchain and caches
        uses: ./.github/actions/setup-verus
        with:
          verus: 'false'
          install-verusfmt: 'true'

      - name: Fetch Verus sources for the vstd path dependency
        run: |
          VERUS_COMMIT=$(git ls-remote https://github.com/asterinas/verus HEAD | cut -f1)
          mkdir -p tools/verus
          curl -Ls "https://github.com/asterinas/verus/archive/${VERUS_COMMIT}.tar.gz" | tar xz -C tools/verus --strip-components=1
          test -f tools/verus/source/vstd/Cargo.toml

      - name: Run format
        run: make fmt

      - name: Check for formatting changes
        run: |
          if [[ -n $(git status --porcelain) ]]; then
            echo "Code is not properly formatted. Run 'make fmt'."
            git diff
            echo "FMT_FAILED=1" >> "$GITHUB_ENV"
            exit 1
          fi

      - name: Publish summary
        if: always()
        run: |
          {
            echo "# Format Summary"
            if [[ "${FMT_FAILED:-0}" == "1" ]]; then
              echo "- Formatting: ❌ failed"
            else
              echo "- Formatting: ✅ passed"
            fi
          } >> "$GITHUB_STEP_SUMMARY"

  perf:
    # Every event: parses the verify leg's log and computes the verification
    # cost compared to the measurement from last main. The comparison lands
    # in the job summary and the report artifact.
    needs: [format-and-verify]
    if: >
      always() &&
      !cancelled() &&
      needs.format-and-verify.result != 'cancelled'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}

      - name: Record which commit was checked out
        run: echo "CUR_SHA=$(git rev-parse HEAD)" >> "$GITHUB_ENV"

      - name: Restore prior measurement (baseline)
        uses: actions/cache/restore@v6
        with:
          path: perf-store
          key: perf-metrics-${{ github.sha }}
          restore-keys: |
            perf-metrics-

      - name: Save aside the baseline (if any)
        run: |
          if [[ -f perf-store/metrics.json ]]; then
            BASELINE_SHA=$(cat perf-store/source-sha.txt 2>/dev/null || echo unknown)
            echo "BASELINE_SHA=$BASELINE_SHA" >> "$GITHUB_ENV"
            mv perf-store/metrics.json perf-baseline.json
            echo "Baseline: $BASELINE_SHA"
          else
            echo "No prior measurement cached; nothing to compare against yet."
          fi

      - name: Download verification log
        uses: actions/download-artifact@v8
        with:
          name: verify-log-ubuntu-24.04

      - name: Parse cost metrics
        run: |
          mkdir -p perf-store
          python3 tools/verus_perf.py parse verify_output.txt > perf-store/metrics.json
          echo "$CUR_SHA" > perf-store/source-sha.txt
          echo "recorded run for: $CUR_SHA"
          cat perf-store/metrics.json

      - name: Compare against the prior measurement
        run: |
          mkdir -p out
          if [[ -f perf-baseline.json ]]; then
            {
              echo "## Verification cost"
              echo
              echo "Comparing this run (\`$CUR_SHA\`) against the last main measurement (\`${BASELINE_SHA:-unknown}\`)."
              echo
              python3 tools/verus_perf.py compare perf-baseline.json perf-store/metrics.json
            } > out/perf-report.md
          else
            {
              echo "## Verification cost: first recorded baseline"
              echo
              echo "No prior measurement was cached; nothing to compare against yet. This run's cost (\`$CUR_SHA\`):"
              echo
              echo '```'
              cat perf-store/metrics.json
              echo '```'
            } > out/perf-report.md
          fi
          cat out/perf-report.md
          cat out/perf-report.md >> "$GITHUB_STEP_SUMMARY"

      - name: Upload report artifact
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: verify-perf-report
          path: |
            out/perf-report.md
            perf-store/metrics.json
            perf-baseline.json
          if-no-files-found: ignore

  doc:
    # PRs build the docs; pushes also upload the artifact for `doc-deploy`,
    # which merges in the gh-pages benchmark and deploys.
    if: >
      always() &&
      !cancelled()
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    timeout-minutes: 90
    steps:
      - name: Mark doc CI as pending
        if: github.event_name == 'push'
        continue-on-error: true
        uses: actions/github-script@v9
        env:
          STATUS_SHA: ${{ github.sha }}
        with:
          retries: 3
          script: |
            const { owner, repo } = context.repo;
            const runUrl = `${context.serverUrl}/${owner}/${repo}/actions/runs/${context.runId}`;

            await github.rest.repos.createCommitStatus({
              owner,
              repo,
              sha: process.env.STATUS_SHA,
              state: 'pending',
              context: 'ci/doc',
              description: 'Docs build is running',
              target_url: runUrl,
            });

      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Set up toolchain and caches
        uses: ./.github/actions/setup-verus
        with:
          verus: 'true'
          dv-cache: 'restore'

      - name: Build docs
        run: make doc

      - name: Upload doc artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@v7
        with:
          name: doc-site
          path: doc
          retention-days: 7
          if-no-files-found: error

      - name: Publish summary
        if: always()
        run: |
          {
            echo "# Doc Summary"
            echo "- Docs build: ${{ job.status == 'success' && '✅ passed' || '❌ failed' }}"
          } >> "$GITHUB_STEP_SUMMARY"

  doc-deploy:
    # Pushes only: merge the doc artifact with the gh-pages benchmark chart
    # (pushed by `perf`) and deploy. Needs format-and-verify so a failed
    # verification can't deploy docs.
    needs: [doc, perf, format-and-verify]
    if: >
      always() &&
      !cancelled() &&
      github.event_name != 'pull_request' &&
      needs.format-and-verify.result == 'success' &&
      needs.doc.result == 'success' &&
      (needs.perf.result == 'success' || needs.perf.result == 'skipped')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write      # deploy to GitHub Pages
      id-token: write   # deploy to GitHub Pages
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        # Provides the git dir for the gh-pages fetch below.
        uses: actions/checkout@v7

      - name: Download doc artifact
        uses: actions/download-artifact@v8
        with:
          name: doc-site
          path: doc

      # Serve the benchmark chart at <site>/dev/bench/.
      - name: Embed verify-perf benchmark into the doc artifact
        run: |
          set -e
          if ! git fetch --depth=1 origin gh-pages 2>/dev/null; then
            echo "no gh-pages branch yet; benchmark not embedded"
            exit 0
          fi
          git checkout FETCH_HEAD -- dev/bench || { echo "no dev/bench on gh-pages; skipping"; exit 0; }
          mkdir -p doc/dev
          mv dev/bench doc/dev/bench
          rmdir dev 2>/dev/null || true
          echo "embedded dev/bench into the doc artifact:"
          ls doc/dev/bench

      - name: Upload pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: doc

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5

  report:
    # `ci/doc` status for push runs; `always()` flips pending -> failure.
    needs: [doc, doc-deploy]
    if: always() && github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      statuses: write
    timeout-minutes: 10
    steps:
      - name: Report doc status on the commit
        continue-on-error: true
        uses: actions/github-script@v9
        env:
          STATUS_SHA: ${{ github.sha }}
        with:
          retries: 3
          script: |
            const { owner, repo } = context.repo;
            const runUrl = `${context.serverUrl}/${owner}/${repo}/actions/runs/${context.runId}`;

            const buildResult = '${{ needs.doc.result }}';
            const deployResult = '${{ needs.doc-deploy.result }}';
            // deploy is skipped when docs aren't published -- not a failure.
            const ok = buildResult === 'success' &&
              (deployResult === 'success' || deployResult === 'skipped');

            await github.rest.repos.createCommitStatus({
              owner,
              repo,
              sha: process.env.STATUS_SHA,
              state: ok ? 'success' : 'failure',
              context: 'ci/doc',
              description: ok ? 'Docs CI succeeded' : 'Docs CI failed',
              target_url: runUrl,
            });
