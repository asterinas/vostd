name: Run Verus Update Test

on:
  repository_dispatch:
    types: [verus-update-test]

jobs:
  run-tests:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            rust_target: x86_64-unknown-none
          - os: ubuntu-latest
            rust_target: riscv64imac-unknown-none-elf
          - os: macos-14
            rust_target: x86_64-unknown-none

    runs-on: ${{ matrix.os }}

    env:
      CARGO_TERM_COLOR: always

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.client_payload.branch }}
          submodules: recursive

      - name: Install dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt update -qq
          sudo apt install -y build-essential unzip pkg-config libssl-dev llvm

      - name: Run tests on main branch
        shell: bash
        run: |
          echo "=== Running tests on main branch (${{ runner.os }}, ${{ matrix.rust_target }}) ==="

          git fetch origin main
          git checkout main
          git submodule update --init --recursive

          git config --global user.name "Verus CI Bot"
          git config --global user.email "ci@asterinas.verus"

          cargo dv bootstrap --branch update-test

          set -o pipefail
          if ! make verify-${{ matrix.rust_target }} 2>&1; then
            echo "❌ Verification failed on ${{ runner.os }} (${{ matrix.rust_target }})"
            exit 1
          else
            echo "✅ Verification passed on ${{ runner.os }} (${{ matrix.rust_target }})"
          fi

  dispatch-promotion:
    needs: run-tests
    runs-on: ubuntu-latest

    steps:
      - name: Dispatch back to fork for promotion
        uses: peter-evans/repository-dispatch@v4
        with:
          token: ${{ secrets.VERUS_TEST_TOKEN }}
          repository: asterinas/verus
          event-type: verus-update-test-success
          client-payload: '{"branch":"update-test"}'
