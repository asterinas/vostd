[package]
name = "vstd_extra"
version = "0.1.0"
edition = "2021"

[package.metadata.verus]
verify = true

[features]
default = []
# The isolated IRC11 toolchain builds vstd with weak-memory support. Keep this
# feature as a source gate so the mainline vstd dependency remains unchanged.
irc11 = []
# Type identity (`typing::`) needs `type_id` support Keep it a source gate so this crate
# still builds against a stock Verus, where `verus_builtin::type_id` does not
# exist.
type_id = []
std = ["vstd/std"]

[dependencies]
vstd = { workspace = true }
