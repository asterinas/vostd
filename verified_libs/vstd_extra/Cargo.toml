[package]
name = "vstd_extra"
version = "0.1.0"
edition = "2021"

[package.metadata.verus]
verify = true

[features]
default = []
# The isolated IRC11 toolchain builds vstd with weak-memory support. Keep this
# feature as a source gate so the mainline vstd dependency remains unchanged.
irc11 = []
std = ["vstd/std"]

[dependencies]
vstd = { workspace = true }

[target.'cfg(target_arch = "x86_64")'.dependencies]
x86_64 = "0.14.13"
