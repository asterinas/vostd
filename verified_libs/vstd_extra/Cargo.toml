[package]
name = "vstd_extra"
version = "0.1.0"
edition = "2021"

[package.metadata.verus]
verify = true

[features]
default = []
# The isolated IRC11 toolchain builds vstd with weak-memory support. Keep this
# feature as a source gate so the mainline vstd dependency remains unchanged.
irc11 = []
std = ["vstd/std", "libflate/std"]
# OSTD rustdoc sets cfg(feature = "std") while its codec dependencies use no_std.
# Only load the codec specs for the bzImage crates.
bzimage = []

[dependencies]
vstd = { workspace = true }
bitvec.workspace = true
smallvec = "1.13.2"
acpi = "=5.2.0"
xmas-elf = "0.10.0"
bytemuck = "1.17.0"
libflate = { version = "=2.3.2", default-features = false }
no_std_io2 = { version = "=0.9.4", default-features = false, features = ["alloc"] }

[target.'cfg(target_arch = "x86_64")'.dependencies]
x86_64 = { version = "0.15.5", default-features = false, features = ["instructions"] }
x86 = "0.52.0"

[lints]
workspace = true
